- type: entity
  parent: VendingMachineYouTool
  id: PenumbraVendingMachineTools
  name: Surplus Tools Vendor
  description: A vendor for surplus tools, perfect for any wanna-be engineers, or people with less than admirable kleptomania.
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _Penumbra/Structures/Machines/VendingMachines/tools.rsi
    snapCardinals: false
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

- type: entity
  parent: VendingMachineEngivend
  id: PenumbraVendingMachineEngiTools
  name: Engineering Tools Vendor
  description: A vendor for tools for engineering personnel.
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _Penumbra/Structures/Machines/VendingMachines/engi_tools.rsi
    snapCardinals: false
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

- type: entity
  parent: PenumbraBaseVendingMachine
  id: PenumbraVendingMachineEngiGear
  name: Engineering Equipment Rack
  description: An automated gear rack hooked up directly to the cargo holds below, bringing up requested equipment at a buttons press.
  components:
  - type: VendingMachine
    pack: PenumbraEngiGearInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
  - type: DatasetVocalizer
    dataset: EngiDrobeAds
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _Penumbra/Structures/Machines/VendingMachines/engi_gear.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#b89e2a"
  - type: AccessReader
    access: [["Engineering"]]
  - type: ActivatableUIRequiresAccess
  - type: AmbientMusicMarkerEngineering

- type: vendingMachineInventory
  id: PenumbraEngiGearInventory
  startingInventory:
    ClothingBackpackDuffelEngineering: 3
    ClothingBackpackSatchelEngineering: 3
    ClothingBackpackEngineering: 3
    ClothingUniformJumpsuitEngineering: 3
    ClothingUniformJumpskirtEngineering: 3
    ClothingUniformJumpsuitEngineeringHazard: 3
    ClothingShoesColorBlack: 3
    ClothingOuterVestHazard: 3
    ClothingShoesBootsWork: 3
    ClothingHeadHatHardhatYellow: 3
    ClothingHeadHatHardhatOrange: 3
    ClothingHeadsetEngineering: 3
    ClothingOuterWinterEngi: 2
    ClothingNeckScarfStripedOrange: 3
    ClothingShoesBootsWinterEngi: 2
  contrabandInventory:
    ToyFigurineEngineer: 1
    ToyFigurineChiefEngineer: 1
