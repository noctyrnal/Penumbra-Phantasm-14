- type: entity
  parent: PenumbraClosetBase
  id: PenumbraClosetTools
  name: tool closet
  description: It's a storage unit for tools.
  components:
  - type: Sprite
    sprite: _Penumbra/Structures/Storage/Closets/engineering_tools.rsi

- type: entityTable
  id: PenumbraFillClosetTool
  table: !type:AllSelector
    children:
    - id: ClothingOuterVestHazard
      prob: 0.4
    - id: FlashlightLantern
      prob: 0.7
    - id: Screwdriver
      prob: 0.7
    - id: Wrench
      prob: 0.7
    - id: Welder
      prob: 0.7
    - id: Crowbar
      prob: 0.7
    - id: Wirecutter
      prob: 0.7
    - id: Multitool
      prob: 0.2
    - id: trayScanner
      prob: 0.7
    - id: GasAnalyzer
      prob: 0.7
    - id: ClothingBeltUtility
      prob: 0.2
    - id: ClothingHandsGlovesColorYellow
      prob: 0.05
    - !type:GroupSelector
      prob: 0.4
      children:
      - id: ClothingHeadHatHardhatRed
      - id: ClothingHeadHatHardhatBlue
      - id: ClothingHeadHatHardhatOrange
      - id: ClothingHeadHatHardhatWhite
      - id: ClothingHeadHatHardhatYellow
      - id: ClothingHeadHatHardhatYellowDark
    - id: CableApcStack
      prob: 0.3
      rolls: !type:ConstantNumberSelector
        value: 3
    - id: SprayPainter
      prob: 0.7

- type: entity
  parent: PenumbraClosetTools
  id: PenumbraClosetToolsFilled
  suffix: Penumbra, Filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: PenumbraFillClosetTool

- type: entity
  parent: PenumbraClosetBase
  id: PenumbraClosetRadiation
  name: radiation suit closet
  description: More comfortable than radiation poisioning.
  components:
  - type: Sprite
    sprite: _Penumbra/Structures/Storage/Closets/engineering_rads.rsi
