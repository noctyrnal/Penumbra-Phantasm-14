- type: entity
  parent: BaseFoodCondiment
  id: PenumbraBaseFoodCondimentBottle
  abstract: true
  suffix: Penumbra
  components:
  - type: Edible
    edible: Drink
    solution: food
    destroyOnEmpty: false
    utensil: None
  - type: Openable
    sound:
      collection: pop
    closeable: true
  - type: Solution
    solution:
      maxVol: 50 # ~ 400 to 450ml
  - type: RefillableSolution
    solution: food
  - type: Spillable
    solution: food
  - type: SolutionTransfer
    canChangeTransferAmount: true
    minTransferAmount: 5
    maxTransferAmount: 30
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      Glass: 50

- type: entity
  parent: PenumbraBaseFoodCondimentBottle
